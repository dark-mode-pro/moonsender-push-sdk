name: publish

# Full verification gate, then npm publish via trusted publishing (OIDC) with provenance.
#
# This FILENAME is the npm trusted-publisher binding: npm validates the OIDC token's workflow_ref
# claim against it, so renaming this file breaks publishing — with a 404 on PUT, since npm masks
# the permission failure — until the binding on npmjs.com is updated to match.
#
# Normally triggered by release-please dispatching it at the tag it just cut (see
# release-please.yml; bot-created tags cannot fire the tag trigger themselves). The tag trigger
# remains as the manual emergency fallback. Either way the ref must match package.json.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; don't rely on the bundled version.
      - run: npm install -g npm@latest && npm --version

      - name: Ref must be a tag matching package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "ref ${GITHUB_REF_NAME} != package.json ${PKG}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:size
      - run: npm publish
